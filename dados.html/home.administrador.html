<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home - Administrador</title>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../shared/globals.css">
</head>
<body>
    <a class="skip-link" href="#mainContent">Pular para o conteúdo</a>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar" aria-hidden="true">
            <div class="sidebar-header">⚙️ Painel Admin</div>
            <nav class="sidebar-nav">
                <h3>Dashboard</h3>
                <button data-nav="painel" class="active">Painel</button>
                <button data-nav="relatorios">Relatórios</button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" aria-controls="sidebar" aria-expanded="false">☰</button>
                <h1 id="mainContent">Painel do Administrador</h1>
            </header>

            <section>
                <div class="card"><h2>Visão Geral</h2><p style="color:var(--color-text-secondary);">Conteúdo do painel administrativo</p></div>
            </section>
        </main>
        </div>
        <script>
            document.querySelectorAll('.menu-toggle').forEach(btn => btn.addEventListener('click', () => {
                const aside = document.getElementById('sidebar');
                const isOpen = aside.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }));
            document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ const aside=document.getElementById('sidebar'); if(aside){ aside.classList.remove('open'); document.querySelectorAll('.menu-toggle').forEach(b=>b.setAttribute('aria-expanded','false')); } }});
        </script>
</body>
</html>
