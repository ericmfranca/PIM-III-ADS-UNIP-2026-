<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro Nem Colei — plataforma de prática e simulados">
  <meta name="theme-color" content="#12141C">
  <title>Cadastro | Nem Colei</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dados.css/globals.css">
  <link rel="stylesheet" href="../dados.css/index.login.css">
  <link rel="stylesheet" href="../dados.css/style.login.css">
  <script src="../dados.js/register.js" defer></script>
</head>

<body>
  <div class="login-card">
    <img src="../logo.png" alt="Logo Nem Colei" class="logo">
    <h1>Cadastro</h1>
    <input type="text" id="nome" placeholder="Nome completo">
    <br><br>
    <input type="email" id="email" placeholder="Email">
    <br><br>
    <input type="password" id="senha" placeholder="Senha">
    <br><br>
    <input type="password" id="confirmarSenha" placeholder="Confirmar senha">
    <br><br>
    <button type="button" onclick="registerUser()">Cadastrar</button>
    <div id="registerMessage" class="form-message" aria-live="polite"></div>
    <p>Já tem conta? <a href="index.testpratica.html">Voltar ao login</a></p>
  </div>
</body>
</html>
